function invalidateInspection(clear=true){state.inspectionGeneration++;state.inspectionJob?.abort();state.inspectionJob=null;state.inspecting=false;if(clear)state.inspection=null;}
function stableDraft(value){if(Array.isArray(value))return value.map(stableDraft);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(key=>[key,stableDraft(value[key])]));return value;}
function draftSnapshot(){return {draft:clone(state.draft),platforms:[...state.platforms],selected:state.selected,presets:clone(state.data.presets)};}
function draftKey(snapshot){const draft=clone(snapshot.draft),platforms=[...snapshot.platforms].sort();draft.enabledPlatforms=platforms;return JSON.stringify(stableDraft([draft,platforms]));}
function resetDraftHistory(){state.undoStack=[];state.redoStack=[];state.historyCurrent=draftSnapshot();state.cleanKey=draftKey(state.historyCurrent);}
function rememberDraft(){const next=draftSnapshot();if(state.historyCurrent&&draftKey(next)!==draftKey(state.historyCurrent)){state.undoStack.push({...state.historyCurrent,persisted:false});if(state.undoStack.length>50)state.undoStack.shift();state.redoStack=[];}state.historyCurrent=next;state.dirty=draftKey(next)!==state.cleanKey;}
function acceptState(data,{preserveDraft=false,keepHistory=false}={}){invalidateInspection();state.data=data;if(!preserveDraft||!state.draft){state.draft=clone(data.configuration);state.platforms=[...data.enabledPlatforms];state.selected=null;state.dirty=false;}if(keepHistory){state.historyCurrent=draftSnapshot();const key=draftKey(state.historyCurrent);if(key!==state.cleanKey)state.undoStack.forEach(entry=>entry.persisted=true);state.cleanKey=key;}else if(!preserveDraft||!state.historyCurrent)resetDraftHistory();else state.historyCurrent=draftSnapshot();if(data.inspection)state.inspection=data.inspection;if(data.notes?.length&&!state.notice)state.notice={text:data.notes.join(' '),error:false};}
async function travelDraft(redo=false){const from=redo?state.redoStack:state.undoStack,to=redo?state.undoStack:state.redoStack;if(state.busy||!from.length)return;const target=clone(from[from.length-1]),current=draftSnapshot(),persist=!state.advanced&&target.persisted===true;await operation(async()=>{let response;if(persist)response=await bridge.action({action:'saveDraft',configuration:target.draft,platforms:target.platforms});from.pop();to.push({...current,persisted:target.persisted===true});state.draft=target.draft;state.platforms=target.platforms;state.selected=target.selected;if(response?.state)state.data=response.state;state.data.presets=target.presets;const chosen=state.selected==='previous'?state.data.previousDraft:state.data.presets.find(x=>x.id===state.selected)?.configuration||state.data.savedPresets.find(x=>x.id===state.selected)?.configuration;if(state.selected&&(!chosen||recipeKey(chosen,state.platforms)!==recipeKey(state.draft,state.platforms)))state.selected=null;state.previewJob?.abort();state.previewJob=null;state.preview=null;state.generation++;if(state.modal?.kind==='review')state.modal=null;invalidateInspection();state.historyCurrent=draftSnapshot();if(persist){state.cleanKey=draftKey(state.historyCurrent);}state.dirty=draftKey(state.historyCurrent)!==state.cleanKey;});}
function draftShortcut(event){if(!(event.metaKey||event.ctrlKey)||event.altKey||event.key.toLowerCase()!=='z')return false;const target=event.target||document.activeElement;if(target?.isContentEditable||target?.closest?.('input,textarea,[contenteditable="true"],[role="textbox"]'))return false;const redo=!!event.shiftKey;if(state.busy||!(redo?state.redoStack:state.undoStack).length)return false;event.preventDefault();void travelDraft(redo);return true;}
function beginEdit(){if(state.advanced||state.busy)return;state.editSnapshot={draft:clone(state.draft),platforms:[...state.platforms],selected:state.selected,dirty:state.dirty,presets:clone(state.data.presets),undoStack:clone(state.undoStack),redoStack:clone(state.redoStack)};state.advanced=true;state.preview=null;state.generation++;render();}

async function inspect(refreshCache=false){if(state.inspecting||state.busy||!state.platforms.length)return;const job=new AbortController(),generation=++state.inspectionGeneration,operationID=state.operationID,platforms=[...state.platforms],owns=()=>!job.signal.aborted&&state.inspectionJob===job&&state.inspectionGeneration===generation&&state.operationID===operationID&&platforms.join(',')===state.platforms.join(',');state.inspectionJob=job;state.inspecting=true;render();try{const response=await bridge.action({action:'inspect',platforms,refresh:refreshCache},{signal:job.signal});if(!owns())return;state.inspection=response.inspection;const failed=response.inspection?.reports?.filter(x=>x.status==='failed');if(failed?.length)showNotice('Some preferences could not be read. Details are in Sources.',true);}catch(error){if(owns())showNotice(error.message,true);}finally{if(state.inspectionJob===job&&state.inspectionGeneration===generation){state.inspectionJob=null;state.inspecting=false;render();}}}

function sourceCard(p){const c=state.data.connections?.find(x=>x.platform===p),n=state.data.nativeSettings?.find(x=>x.platform===p),report=state.inspection?.reports?.find(x=>x.platform===p);return '<section class="source-card"><h3><span class="provider-dot '+p+'"></span>'+NAMES[p]+'</h3><p>'+esc(c?.isInstalled?(c.version||'CLI connected'):'Local CLI not detected')+'</p>'+(c?.path?'<div class="path">'+esc(c.path)+'</div>':'')+(c?.detail?'<p>'+esc(c.detail)+'</p>':'')+(c?.compatibilityWarning?'<p class="warning">'+esc(c.compatibilityWarning)+'</p>':'')+cliAccount(p)+(n?'<div class="separator"></div><div class="detail-label">Saved global model</div>'+(n.modelID?modelLine(n.modelID,p)+(n.effort?'<p>Effort: '+esc(title(n.effort))+'</p>':''):'<p>Not reported</p>')+'<div class="path">'+esc(n.sourcePath)+'</div><p>'+esc(n.detail)+'</p>':'')+(report?'<div class="separator"></div><div class="detail-label">Preference report'+(state.inspection.expiresAt&&Date.parse(state.inspection.expiresAt)<=Date.now()?' · Previous report':'')+'</div><p>'+esc(report.summary)+'</p>'+(report.error?'<p class="warning">'+esc(report.error)+'</p>':'')+preferenceObservations(report,p)+(report.sources||[]).map(e=>'<div class="evidence"><div class="path">'+esc(e.path)+'</div><p>'+esc(e.explanation)+'</p></div>').join('')+(report.notes?.length?'<ul class="notes">'+report.notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''):'')+'</section>';}
function comparison(p,t){const old=observed(p,t),r=getRoute(p,t),description=old?.scope==='usual'?'Compared with a recent project preference.':'Compared with reported saved settings.';function detail(x,unknown=false){if(!x)return '<p class="quiet">Not reported</p>';return (x.modelID?modelLine(x.modelID,p):'<p class="quiet">Model not reported</p>')+(x.effort&&x.modelID!=='auto'?'<div class="effort-detail">'+effortLabel(x.effort)+' effort</div>':'')+(x.additionalAgents||[]).map(a=>modelLine(a.modelID,p)+(a.effort?'<div class="effort-detail">'+effortLabel(a.effort)+' effort</div>':'')).join('')+((x.additionalAgents?.length||0)>0?'<p class="quiet">Team: '+(x.teamMode==='leadReview'?'Lead + focused review':'Independent passes')+'</p>':'')+(x.resultMode&&((x.additionalAgents?.length||0)>0||x.resultMode!=='coordinator')?'<p class="quiet">Result: '+esc({coordinator:'Controller',user:'You choose',ai:'AI judge'}[x.resultMode])+'</p>':'')+(x.resultMode==='ai'&&x.judgeModelID?'<div class="detail-label">Judge</div>'+modelLine(x.judgeModelID,p):'');}return dialog(TASKS.find(x=>x[0]===t)[1]+' · '+NAMES[p],description,'<div class="compare"><div><div class="detail-label">'+(old?.scope==='usual'?'Recent preference':'Saved settings')+'</div>'+detail(old,true)+'</div><div><div class="detail-label">Proposed</div>'+detail(r)+'</div></div>'+(old?.evidence||[]).map(e=>'<div class="evidence"><div class="path">'+esc(e.path)+'</div><p>'+esc(e.explanation)+'</p></div>').join('')+(old?.uncertainties||[]).map(x=>'<p class="quiet">'+esc(x)+'</p>').join(''),button('closeModal','Done','button'),true);}

function reviewDialog(){const p=state.preview;if(!p)return dialog('Review changes',state.modal?.preparing?'Preparing the exact file changes.':'The review could not be prepared.',state.modal?.preparing?'<p class="quiet"><span class="spinner"></span> Preparing…</p>':'',button('closeModal',state.modal?.preparing?'Cancel':'Done','button primary'),true);const titleText={apply:'Review changes',restore:'Restore last apply',uninstall:'Uninstall StandMixer'}[p.kind],action={apply:'Apply changes',restore:'Restore settings',uninstall:'Uninstall'}[p.kind],expired=p.expiresAt&&Date.parse(p.expiresAt)<=Date.now();return dialog(titleText,p.kind==='apply'?'Review the exact file changes before applying this setup.':p.kind==='restore'?'Review the previous settings that will be restored.':'Review the StandMixer settings and files that will be removed.',(p.conflicts||[]).map(x=>'<div class="warning">'+esc(x)+'</div>').join('')+(expired?'<div class="warning">This review expired. Close it and prepare a fresh review.</div>':'')+p.changes.filter(x=>x.isChanged).map(diffFile).join('')+(!p.changedFiles?'<div class="empty"><strong>No file changes</strong>This setup already matches the saved files.</div>':''),!p.changedFiles?button('closeModal','Done','button primary'):'<span class="quiet">'+p.changedFiles+' '+(p.changedFiles===1?'file':'files')+' will change</span>'+button('closeModal','Back','button')+'<button type="button" class="button '+(p.kind==='uninstall'?'danger':'primary')+'" data-action="applyReview"'+(state.busy||expired?' disabled':'')+'>'+(state.busy?'Applying…':action)+'</button>');}
function customModelsDialog(){const custom=state.draft.customModels||[];return dialog('Custom models','Add a model ID from an enabled provider.',custom.map(m=>'<div class="custom-item"><div class="custom-description">'+modelLine(m.id,m.platform)+'<div class="path">'+esc(m.id)+' · '+NAMES[m.platform]+'</div></div>'+button('removeCustom',icon('trash'),'icon-button',{id:m.id,label:'Remove '+m.label})+'</div>').join('')+'<form id="custom-model-form" class="form-grid custom-add"><div class="form-row"><label class="field"><span>Model name</span><input name="label" placeholder="My model" maxlength="80" required></label><label class="field"><span>Provider</span><select name="platform">'+options(state.platforms.map(p=>[p,NAMES[p]]),state.platforms[0])+'</select></label></div><label class="field"><span>Model ID</span><input name="id" placeholder="Exact model identifier" maxlength="160" autocomplete="off" required></label><label class="field"><span>Supported effort levels</span><input name="efforts" value="low, medium, high, xhigh, max" required></label><p class="quiet">Use a model ID supported by your local CLI. Custom definitions are saved with the draft.</p><button type="submit" class="button">Add model</button></form>',button('closeModal','Done','button'),true);}
function renderModal(){const target=document.getElementById('modal-root'),focused=focusSnapshot(),fields=[...target.querySelectorAll('input[name],select[name]')].map(el=>({form:el.form?.id,name:el.name,value:el.value})),scroll=target.querySelector?.('.dialog-body')?.scrollTop||0,openFiles=[...target.querySelectorAll('.file')].map(el=>({path:el.querySelector('.file-path')?.textContent,open:el.open}));if(!state.modal){target.innerHTML='';return;}const m=state.modal;let content='';if(m.kind==='sources'||m.kind==='connection')content=dialog(m.kind==='sources'?'Settings sources':NAMES[m.platform]+' connection','Saved defaults and preferences used for this comparison.',(m.kind==='sources'?PLATFORMS:[m.platform]).map(sourceCard).join('')+accountControls()+(m.kind==='sources'?macInstallControl():'')+(m.kind==='sources'&&state.data.canRestore&&!state.advanced?button('previewRestore','Restore applied settings…','button'):'')+(m.kind==='sources'&&state.data.installation?.hasInstallation&&!state.advanced?button('previewUninstall',icon('trash')+'Uninstall StandMixer…','button danger'):''),(state.inspecting?'<span class="quiet"><span class="spinner"></span> Reading preferences…</span>':'<span class="quiet">Preference reading uses the configured quick models.</span>')+'<button type="button" class="button" data-action="inspect"'+(state.inspecting||!state.platforms.length?' disabled':'')+'>Read preferences</button>'+button('closeModal','Done','button'));else if(m.kind==='compare')content=comparison(m.platform,m.task);else if(m.kind==='review')content=reviewDialog();else if(m.kind==='savePreset')content=dialog('Save a preset','Keep this setup for later.','<form id="save-preset-form" class="form-grid"><label class="field"><span>Name</span><input name="name" value="'+esc(currentTitle()==='Custom draft'?'':currentTitle())+'" placeholder="Preset name" maxlength="80" required autofocus></label><button type="submit" class="button primary"'+(state.busy?' disabled':'')+'>Save preset</button></form>',button('closeModal','Cancel','button'),true);else if(m.kind==='saved')content=dialog('Saved presets','Load a saved setup or keep your current draft.','<div class="saved-list">'+(state.data.previousDraft?savedRow('previous','Previous draft','history'):'')+(state.data.savedPresets||[]).map(x=>savedRow(x.id,x.name,'bookmark',true)).join('')+'</div>',button('savePreset','Save current preset','button primary'),true);else if(m.kind==='customModels')content=customModelsDialog();else if(m.kind==='deletePreset')content=dialog('Delete saved preset?','This removes the saved preset from your library.','<p class="quiet">'+esc(state.data.savedPresets.find(x=>x.id===m.id)?.name||'Saved preset')+'</p>',button('closeModal','Cancel','button')+button('confirmDelete','Delete preset','button danger',{id:m.id}),true);else if(m.kind==='installation')content=dialog('Applied settings',state.data.installation.summary,'<p class="quiet">'+esc(state.data.installation.state==='applied'?'The installed files match the last StandMixer Apply.':'Choose a setup and review its file changes before applying.')+'</p><ul class="notes">'+(state.data.installation.details||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>',button('closeModal','Done','button'),true);target.innerHTML=content;target.querySelectorAll('[data-label]').forEach(el=>el.setAttribute('aria-label',el.dataset.label));for(const el of target.querySelectorAll('input[name],select[name]')){const old=fields.find(x=>x.form===el.form?.id&&x.name===el.name);if(old)el.value=old.value;}for(const el of target.querySelectorAll('.file')){const old=openFiles.find(x=>x.path===el.querySelector('.file-path')?.textContent);if(old)el.open=old.open;}const body=target.querySelector?.('.dialog-body');if(body)body.scrollTop=scroll;restoreFocus(focused);}
function openModal(modal){state.modal=modal;state.modalError=null;renderModal();requestAnimationFrame(()=>document.querySelector('.dialog input,.dialog button,.dialog select')?.focus());}
function editField(element){if(state.busy)return;const {platform:p,task:t,field}=element.dataset,r=getRoute(p,t);if(!r)return;const i=Number(element.dataset.index||0),a=i===0?r:r.additionalAgents[i-1],value=element.value;if(field==='model'){if(t==='coordinator'&&i===0&&value==='auto'){r.modelID='auto';r.effort=clone(AUTO);markDirty();render();return;}const m=availableModels(p,t).find(x=>x.id===value);if(!m||!a)return;a.modelID=m.id;if(i>0)a.modelPlatform=m.platform;const e=a.effort||clone(AUTO),levels=m.supportedEfforts||LEVELS;if(e.mode==='fixed'&&!levels.includes(e.value))e.value=levels[levels.length-1];if(e.mode==='range'){if(!levels.includes(e.minimum))e.minimum=levels[0];if(!levels.includes(e.maximum))e.maximum=levels[levels.length-1];}a.effort=e;}else if(field==='effort'){if(!a||isAutoController(r))return;a.effort={...(a.effort||AUTO),mode:value==='auto'?'auto':value==='range'?'range':'fixed'};if(!['auto','range'].includes(value))a.effort.value=value;}else if(field==='minimum'||field==='maximum'){if(!a||isAutoController(r))return;a.effort={...(a.effort||AUTO),[field]:value};if(LEVELS.indexOf(a.effort.minimum)>LEVELS.indexOf(a.effort.maximum))a.effort[field==='minimum'?'maximum':'minimum']=value;}else if(field==='team'){if(t==='coordinator')return;const count=Math.min(4,Math.max(1,Number(value)));r.additionalAgents=r.additionalAgents||[];while(r.additionalAgents.length<count-1)r.additionalAgents.push({id:crypto.randomUUID(),modelID:r.modelID,effort:clone(r.effort),modelPlatform:model(r.modelID).platform});r.additionalAgents=r.additionalAgents.slice(0,count-1);if(count===1){r.resultMode='coordinator';delete r.judgeModelID;}}else if(field==='teamMode'){if(t==='coordinator'||!['leadReview','parallel'].includes(value))return;r.teamMode=value;}else if(field==='result'){r.resultMode=value;if(value==='ai'&&!r.judgeModelID)r.judgeModelID=isAutoController(getRoute(p,'coordinator'))?r.modelID:getRoute(p,'coordinator').modelID;}else if(field==='judge'){if(!availableModels(p,t).some(x=>x.id===value))return;r.judgeModelID=value;}markDirty();render();}
async function handleAction(action,d={}){if(state.busy&&!['dismiss','closeModal','sources','connection','compare'].includes(action))return;switch(action){case'retry':return initialize();case'dismiss':state.notice=null;render();break;case'edit':case'advanced':beginEdit();break;case'cancelEdit':cancelEdit();break;case'saveEdit':await saveEdit();break;case'undoDraft':await travelDraft();break;case'redoDraft':await travelDraft(true);break;case'preset':{const p=state.data.presets.find(x=>x.id===d.id);if(p)selectConfiguration(p.configuration,p.id);break;}case'savedPreset':{let c=d.id==='previous'?state.data.previousDraft:state.data.savedPresets.find(x=>x.id===d.id)?.configuration;if(c){state.modal=null;selectConfiguration(c,d.id);}break;}case'togglePlatform':{invalidateInspection();const ps=state.platforms.includes(d.platform)?state.platforms.filter(x=>x!==d.platform):[...state.platforms,d.platform],key=selectedKey();await operation(async()=>{const response=await bridge.action({action:'state',platforms:ps});state.platforms=ps;state.data={...response.state};const preset=response.state.presets.find(x=>x.id===key);if(preset)state.draft=clone(preset.configuration);state.selected=preset?.id||null;markDirty();state.selected=preset?.id||null;state.historyCurrent=draftSnapshot();});break;}case'connections':await operation(()=>refresh(true));break;case'saveDraft':if(state.advanced){await saveEdit();break;}await operation(async()=>{const response=await bridge.action({action:'saveDraft',configuration:clone(state.draft),platforms:[...state.platforms]});acceptState(response.state,{keepHistory:true});showNotice(response.result?.message||'Draft saved.');});break;case'preview':await prepare('apply');break;case'previewRestore':await prepare('restore');break;case'previewUninstall':await prepare('uninstall');break;case'applyReview':await applyReview();break;case'closeModal':if(state.committing)return;if(state.previewJob){state.previewJob.abort();state.previewJob=null;state.preview=null;state.generation++;state.operationID++;state.busy=false;}state.modal=null;state.modalError=null;render();break;case'savePreset':if(!state.advanced)openModal({kind:action});break;case'sources':case'customModels':case'installation':case'saved':openModal({kind:action});break;case'connection':openModal({kind:'connection',platform:d.platform});break;case'compare':openModal({kind:'compare',platform:d.platform,task:d.task});break;case'expand':try{const result=await bridge.rpc('ui/request-display-mode',{mode:state.host.displayMode==='fullscreen'?'inline':'fullscreen'});state.host.displayMode=result.mode;}catch(error){showNotice(error.message,true);render();}break;case'inspect':await inspect(true);break;case'openWeb':await openInterface('web');break;case'openMac':await openInterface('mac');break;case'installMac':await installMac();break;case'checkAccounts':await checkAccounts();break;case'deletePreset':if(state.advanced)return;openModal({kind:'deletePreset',id:d.id});break;case'confirmDelete':if(state.advanced)return;await operation(async()=>{const response=await bridge.action({action:'deletePreset',presetID:d.id});acceptState(response.state,{preserveDraft:true});if(state.selected===d.id)state.selected=null;state.modal=null;showNotice('Preset deleted.');});break;case'removeCustom':{const used=state.draft.profiles.some(p=>p.routes.some(r=>r.modelID===d.id||r.judgeModelID===d.id||r.additionalAgents?.some(a=>a.modelID===d.id)));if(used){state.modalError='Choose another model for its assignments before removing this definition.';renderModal();return;}state.draft.customModels=state.draft.customModels.filter(x=>x.id!==d.id);markDirty();render();break;}}}
async function submitForm(form){if(state.busy)return;const values=Object.fromEntries(new FormData(form));if(form.id==='save-preset-form'){if(state.advanced)return;const name=values.name.trim();if(!name)return;await operation(async()=>{const response=await bridge.action({action:'savePreset',name,configuration:clone(state.draft),platforms:[...state.platforms]});acceptState(response.state,{preserveDraft:true});state.selected=response.state.savedPresets.find(x=>x.name===name)?.id||null;state.modal=null;showNotice('Preset saved.');});}else if(form.id==='custom-model-form'){const id=values.id.trim(),label=values.label.trim(),platform=values.platform,efforts=values.efforts.split(',').map(x=>x.trim()).filter(Boolean);if(id==='auto'){state.modalError='Auto is reserved for the Controller setting.';renderModal();return;}if(!id||!label||!/^[a-zA-Z0-9][a-zA-Z0-9._:/\[\]-]*$/.test(id)){state.modalError='Enter a model name and a valid model ID.';renderModal();return;}if(catalog().some(x=>x.id===id)){state.modalError='That model ID is already in the catalog.';renderModal();return;}if(!state.platforms.includes(platform)||!efforts.length||efforts.some(x=>!LEVELS.includes(x))||(platform==='claude'&&efforts.includes('ultra'))){state.modalError='Choose an enabled provider and supported effort levels. Claude supports Low through Max.';renderModal();return;}state.draft.customModels.push({id,label,platform,supportedEfforts:[...new Set(efforts)],isDiscovered:false});form.reset();markDirty();render();}}
let sizeFrame=0;
function scheduleSize(){if(!bridge?.ready||bridge.http||sizeFrame)return;sizeFrame=requestAnimationFrame(()=>{sizeFrame=0;bridge.notify('ui/notifications/size-changed',{height:Math.ceil(document.getElementById('root').getBoundingClientRect().height)});});}
function applyHost(context){state.host=context||{};if(context.theme)document.documentElement.dataset.theme=context.theme;for(const [key,value]of Object.entries(context.styles?.variables||{}))if(key.startsWith('--')&&typeof value==='string')document.documentElement.style.setProperty(key,value);if(state.data)render();}
function updateNotice(){return state.updateInfo?'<p class="quiet" role="status" style="color:var(--accent);margin:0 0 8px" title="Run $standmixer update in Codex or /standmixer update in Claude Code.">Update available · '+esc(state.updateInfo.latestVersion)+'</p>':'';}
async function checkUpdates(){if(!state.data?.canCheckUpdates||state.checkingUpdates)return;state.checkingUpdates=true;try{const response=await bridge.action({action:'checkUpdates'});state.updateInfo=response.update||null;if(!state.advanced&&!state.modal)render();}catch(_){}finally{state.checkingUpdates=false;}}
async function initialize(){if(state.initialized&&!state.notice)return;invalidateInspection();bridge?.dispose();state.notice=null;state.initialized=true;render();bridge=new Bridge(window);bridge.onContext=applyHost;bridge.onResult=result=>{try{const value=unpack(result);if(value.ok&&value.state&&!state.data){acceptState(value.state);render();}}catch{}};try{await bridge.connect();if(!state.data)await refresh(false);void checkUpdates();}catch(error){showNotice(error.message,true);render();}}
function start(){window.addEventListener('pagehide',()=>{bridge?.dispose();});document.addEventListener('click',event=>{const element=event.target.closest('[data-action]');if(element&&!element.disabled)handleAction(element.dataset.action,element.dataset).catch(error=>{showNotice(error.message,true);render();});});document.addEventListener('change',event=>{if(event.target.matches('[data-field]'))editField(event.target);});document.addEventListener('submit',event=>{if(['save-preset-form','custom-model-form'].includes(event.target.id)){event.preventDefault();submitForm(event.target);}});document.addEventListener('keydown',event=>{if(draftShortcut(event))return;if(event.key==='Escape'&&state.modal)handleAction('closeModal');if(event.key==='Tab'&&state.modal){const elements=[...document.querySelectorAll('.dialog button:not([disabled]),.dialog input,.dialog select,.dialog summary')];const first=elements[0],last=elements[elements.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});if(window.matchMedia?.('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark';if(typeof ResizeObserver!=='undefined')new ResizeObserver(scheduleSize).observe(document.getElementById('root'));initialize();}
if(typeof module!=='undefined'&&module.exports){module.exports={TASKS,LEVELS,esc,effortKey,effortLabel,routeKey,recipeKey,matchedPreset,modelIdentity,knownChanges,unpack,reviewRequest,Bridge,state,acceptState,observed,assignment,matrix,sidebar,diffFile,reviewDialog,editField,handleAction,applyReview,prepare,render,selectConfiguration,catalog,inspect,initialize,sourceCard,installMac,macInstallControl,brand,interfacePicker,openInterface,safeWebURL,checkAccounts,cliAccount,accountControls,beginEdit,cancelEdit,saveEdit,draftKey,draftShortcut,travelDraft,installationLabel,updateNotice,checkUpdates,setBridge:value=>{bridge=value;}};}else start();
