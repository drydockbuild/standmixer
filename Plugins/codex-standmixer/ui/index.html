function draftSaveStatus(){return state.savingDraft?'Saving draft…':state.draftSaveError?'Draft not saved: '+esc(state.draftSaveError):state.busy?'Preparing…':state.dirty?'Draft changed':state.data.hasSavedDraft?'Draft saved':'Click a model or effort to change it';}

function queueDraftSave(automatic=true){state.inlineAutoSave=state.inlineAutoSave||automatic;state.draftSaveError='';const snapshot=draftSnapshot();state.draftSavePending={snapshot,key:draftKey(snapshot),sequence:++state.draftSaveSequence};if(state.draftSavePromise)return state.draftSavePromise;state.savingDraft=true;state.draftSavePromise=Promise.resolve().then(drainDraftSaves);updateDraftSaveStatus();return state.draftSavePromise;}
async function drainDraftSaves(){let saved=true;try{while(state.draftSavePending){const request=state.draftSavePending;state.draftSavePending=null;try{const response=await bridge.action({action:'saveDraft',configuration:clone(request.snapshot.draft),platforms:[...request.snapshot.platforms]});if(response.state){state.data.previousDraft=clone(response.state.previousDraft??null);for(const key of ['savedPresets','presets','catalog','preferredPlatforms','installation','canRestore'])if(Object.hasOwn(response.state,key))state.data[key]=clone(response.state[key]);}state.data.configuration=clone(request.snapshot.draft);state.data.enabledPlatforms=[...request.snapshot.platforms];state.data.hasSavedDraft=true;state.cleanKey=request.key;state.dirty=draftKey(draftSnapshot())!==request.key;state.undoStack.forEach(entry=>entry.persisted=true);state.draftSaveError='';saved=true;}catch(error){saved=false;if(!state.draftSavePending)state.draftSaveError=error.message||'Try again.';}}}finally{state.savingDraft=false;state.draftSavePromise=null;updateDraftSaveStatus();}return saved;}
function travelInlineDraft(redo){const from=redo?state.redoStack:state.undoStack,to=redo?state.undoStack:state.redoStack;if(state.busy||!from.length)return;const target=clone(from.pop()),current=draftSnapshot();to.push({...current,persisted:true});state.draft=target.draft;state.platforms=target.platforms;state.selected=target.selected;state.data.presets=target.presets;state.fieldPicker=null;state.previewJob?.abort();state.previewJob=null;state.preview=null;state.generation++;if(state.modal?.kind==='review')state.modal=null;state.historyCurrent=draftSnapshot();state.dirty=draftKey(state.historyCurrent)!==state.cleanKey;render();return queueDraftSave();}
function stableDraft(value){if(Array.isArray(value))return value.map(stableDraft);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(key=>[key,stableDraft(value[key])]));return value;}

function draftKey(snapshot){const draft=clone(snapshot.draft),platforms=[...snapshot.platforms].sort();draft.enabledPlatforms=platforms;return JSON.stringify(stableDraft([draft,platforms]));}

function acceptState(data,{preserveDraft=false,keepHistory=false}={}){state.data=data;if(!preserveDraft||!state.draft){state.draft=clone(data.configuration);state.platforms=[...data.enabledPlatforms];state.selected=null;state.dirty=false;state.fieldPicker=null;state.draftSaveError='';state.inlineAutoSave=false;}if(keepHistory){state.historyCurrent=draftSnapshot();const key=draftKey(state.historyCurrent);if(key!==state.cleanKey)state.undoStack.forEach(entry=>entry.persisted=true);state.cleanKey=key;}else if(!preserveDraft||!state.historyCurrent)resetDraftHistory();else state.historyCurrent=draftSnapshot();if(data.notes?.length&&!state.notice)state.notice={text:data.notes.join(' '),error:false};}
async function travelDraft(redo=false){if(state.inlineAutoSave&&!state.advanced)return travelInlineDraft(redo);const from=redo?state.redoStack:state.undoStack,to=redo?state.undoStack:state.redoStack;if(state.busy||!from.length)return;const target=clone(from[from.length-1]),current=draftSnapshot(),persist=!state.advanced&&target.persisted===true;await operation(async()=>{let response;if(persist)response=await bridge.action({action:'saveDraft',configuration:target.draft,platforms:target.platforms});from.pop();to.push({...current,persisted:target.persisted===true});state.draft=target.draft;state.platforms=target.platforms;state.selected=target.selected;if(response?.state)state.data=response.state;state.data.presets=target.presets;const chosen=state.selected==='previous'?state.data.previousDraft:state.data.presets.find(x=>x.id===state.selected)?.configuration||state.data.savedPresets.find(x=>x.id===state.selected)?.configuration;if(state.selected&&(!chosen||recipeKey(chosen,state.platforms)!==recipeKey(state.draft,state.platforms)))state.selected=null;state.previewJob?.abort();state.previewJob=null;state.preview=null;state.generation++;if(state.modal?.kind==='review')state.modal=null;state.historyCurrent=draftSnapshot();if(persist){state.cleanKey=draftKey(state.historyCurrent);}state.dirty=draftKey(state.historyCurrent)!==state.cleanKey;});}

tate.claudeConnectionConfirmed=false;}await operation(async()=>{const response=await bridge.action({action:'state',platforms:ps});state.platforms=ps;state.data={...response.state};const preset=response.state.presets.find(x=>x.id===key);if(preset)state.draft=clone(preset.configuration);state.selected=preset?.id||null;markDirty();state.selected=preset?.id||null;state.historyCurrent=draftSnapshot();});if(!wasEnabled&&state.platforms.includes(d.platform)&&['codex','claude'].includes(d.platform)){rearmClaudeConnectionPrompt();await offerClaudeConnection();}break;}case'connections':await operation(()=>refresh(true));break;case'saveDraft':if(state.advanced){await saveEdit();break;}await queueDraftSave(false);break;case'preview':await prepare('apply');break;case'previewRestore':await prepare('restore');break;case'previewUninstall':await prepare('uninstall');break;case'applyReview':await applyReview();break;case'closeModal':{if(state.committing)return;const closingClaude=state.modal?.kind==='claudeConnection',resumePreview=closingClaude&&state.claudeResumePreview;if(closingClaude)cancelClaudeConnection();if(state.previewJob){state.previewJob.abort();state.previewJob=null;state.preview=null;state.generation++;state.operationID++;state.busy=false;}state.modal=null;state.modalError=null;render();if(resumePreview)return prepare('apply',true);break;}case'savePreset':if(!state.advanced)openModal({kind:action});break;case'sources':case'customModels':case'installation':case'saved':openModal({kind:action});break;case'connection':openModal({kind:'connection',platform:d.platform});break;case'openClaudeConnection':return openClaudeConnection();case'recheckClaudeConnection':return runClaudeConnection();case'connectClaude':return runClaudeConnection(true);case'compare':openModal({kind:'compare',platform:d.platform,task:d.task});break;case'expand':await expandPanel();break;case'claudeSetup':await bridge.rpc('ui/open-link',{url:'https://code.claude.com/docs/en/setup#install-claude-code'});break;case'openWeb':await openInterface('web');break;case'openMac':await openInterface('mac');break;case'installMac':await installMac();break;case'checkUpdates':await checkUpdates(true);break;case'deletePreset':if(state.advanced)return;openModal({kind:'deletePreset',id:d.id});break;case'confirmDelete':if(state.advanced)return;await operation(async()=>{const response=await bridge.action({action:'deletePreset',presetID:d.id});acceptState(response.state,{preserveDraft:true});if(state.selected===d.id)state.selected=null;state.modal=null;showNotice('Preset deleted.');});break;case'removeCustom':{const used=state.draft.profiles.some(p=>p.routes.some(r=>r.modelID===d.id||r.judgeModelID===d.id||r.additionalAgents?.some(a=>a.modelID===d.id)||r.stuckEscalation?.some(a=>a.modelID===d.id)));if(used){state.modalError='Choose another model for its assignments before removing this definition.';renderModal();return;}state.draft.customModels=state.draft.customModels.filter(x=>x.id!==d.id);markDirty();render();break;}}}
async function submitForm(form){if(state.busy)return;const values=Object.fromEntries(new FormData(form));if(form.id==='save-preset-form'){if(state.advanced)return;const name=values.name.trim();if(!name)return;await operation(async()=>{const response=await bridge.action({action:'savePreset',name,configuration:clone(state.draft),platforms:[...state.platforms]});acceptState(response.state,{preserveDraft:true});state.selected=response.state.savedPresets.find(x=>x.name===name)?.id||null;state.modal=null;showNotice('Preset saved.');});}else if(form.id==='custom-model-form'){const id=values.id.trim(),label=values.label.trim(),platform=values.platform,efforts=values.efforts.split(',').map(x=>x.trim()).filter(Boolean);if(id==='auto'){state.modalError='Auto is reserved for the Controller setting.';renderModal();return;}if(!id||!label||!/^[a-zA-Z0-9][a-zA-Z0-9._:/\[\]-]*$/.test(id)){state.modalError='Enter a model name and a valid model ID.';renderModal();return;}if(catalog().some(x=>x.id===id)){state.modalError='That model ID is already in the catalog.';renderModal();return;}if(!state.platforms.includes(platform)||!efforts.length||efforts.some(x=>!LEVELS.includes(x))||(platform==='claude'&&efforts.includes('ultra'))){state.modalError='Choose an enabled provider and supported effort levels. Claude supports Low through Max.';renderModal();return;}state.draft.customModels.push({id,label,platform,supportedEfforts:[...new Set(efforts)],isDiscovered:false});form.reset();markDirty();render();}}
let sizeFrame=0;
function scheduleSize(){if(!bridge?.ready||bridge.http||sizeFrame)return;sizeFrame=requestAnimationFrame(()=>{sizeFrame=0;bridge.notify('ui/notifications/size-changed',{height:Math.ceil(document.getElementById('root').getBoundingClientRect().height)});});}
function canExpand(){return !!(!bridge?.http&&!state.expandUnavailable&&state.host.displayMode==='inline'&&state.host.availableDisplayModes?.includes('fullscreen'));}
async function expandPanel(){if(!canExpand()||state.expanding)return;state.expanding=true;render();try{const result=await bridge.rpc('ui/request-display-mode',{mode:'fullscreen'},10000);if(result?.mode==='fullscreen'){state.host={...state.host,displayMode:'fullscreen'};}else if(state.host.displayMode!=='fullscreen'){state.expandUnavailable=true;showNotice('Codex kept this panel in its current view. Use the Codex panel controls to resize it.');}}catch(error){state.expandUnavailable=true;showNotice(error.message,true);}finally{state.expanding=false;render();}}
function applyHost(context){state.host=context||{};if(context.theme)document.documentElement.dataset.theme=context.theme;for(const [key,value]of Object.entries(context.styles?.variables||{}))if(key.startsWith('--')&&typeof value==='string')document.documentElement.style.setProperty(key,value);if(state.data)render();}
function updateNotice(){return state.updateInfo?'<p class="quiet" role="status" style="color:var(--accent);margin:0 0 8px" title="Run $standmixer update in Codex or /standmixer update in Claude Code.">Update available · '+esc(state.updateInfo.latestVersion)+'</p>':'';}
function updateControls(){const u=state.updateStatus,date=u?.checkedAt?new Date(u.checkedAt):null,checked=date&&!isNaN(date)?'Last checked '+date.toLocaleString():'Not checked yet',detail=state.checkingUpdates?'Checking…':u?.outcome==='failed'?'Could not check. Try again when online.':u?.outcome==='available'?'Update '+u.latestVersion+' available. Run standmixer update.':u?.outcome==='current'?'Up to date.':u?.outcome==='checking'?'Another check is running.':'';return '<section class="source-card"><h3>StandMixer '+esc(PANEL_VERSION)+'</h3><p>'+esc(checked)+'</p>'+(detail?'<p role="status">'+esc(detail)+'</p>':'')+'<button type="button" class="button" data-action="checkUpdates"'+(state.checkingUpdates||!state.data?.canCheckUpdates?' disabled':'')+'>Check now</button></section>';}
async function checkUpdates(refresh=false){if(!state.data?.canCheckUpdates||state.checkingUpdates)return;state.checkingUpdates=true;if(refresh)renderModal();try{const response=await bridge.action({action:'checkUpdates',...(refresh?{refresh:true}:{})});state.updateInfo=response.update||null;state.updateStatus=response.updateStatus||null;}catch(_){if(refresh)state.updateStatus={...state.updateStatus,outcome:'failed'};}finally{state.checkingUpdates=false;if(state.modal?.kind==='sources')renderModal();else if(!state.advanced&&!state.modal&&!state.fieldPicker)render();}}

async function initialize(){if(state.initialized&&!state.notice)return;bridge?.dispose();rearmClaudeConnectionPrompt();state.notice=null;state.initialized=true;render();bridge=new Bridge(window);bridge.onDispose=cancelClaudeConnection;bridge.onContext=applyHost;bridge.onResult=result=>{try{const value=unpack(result);if(value.ok&&value.state&&!state.data){acceptState(value.state);render();}}catch{}};try{await bridge.connect();if(!state.data)await refresh(false);void checkUpdates();await offerClaudeConnection(false,true);}catch(error){showNotice(error.message,true);render();}}
function start(){window.addEventListener('pagehide',()=>{cancelClaudeConnection();bridge?.dispose();});document.addEventListener('click',event=>{if(state.fieldPicker&&!event.target.closest('.field-picker,.field-trigger'))closeField();const element=event.target.closest('[data-action]');if(element&&!element.disabled)handleAction(element.dataset.action,element.dataset).catch(error=>{showNotice(error.message,true);render();});});document.addEventListener('change',event=>{if(event.target.matches('[data-field]')){if(event.target.dataset.inline==='true')editInlineField(event.target);else editField(event.target);}});document.addEventListener('submit',event=>{if(['save-preset-form','custom-model-form'].includes(event.target.id)){event.preventDefault();submitForm(event.target);}});document.addEventListener('focusout',()=>{if(state.fieldPicker)setTimeout(()=>{if(state.fieldPicker&&!document.activeElement?.closest?.('.field-picker,.field-trigger'))closeField();},0);});document.addEventListener('keydown',event=>{if(draftShortcut(event))return;if(event.key==='Escape'&&state.fieldPicker){event.preventDefault();closeField();return;}if(event.key==='Escape'&&state.modal)handleAction('closeModal');if(event.key==='Tab'&&state.modal){const elements=[...document.querySelectorAll('.dialog button:not([disabled]),.dialog input,.dialog select,.dialog summary')];const first=elements[0],last=elements[elements.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});if(window.matchMedia?.('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark';if(typeof ResizeObserver!=='undefined')new ResizeObserver(scheduleSize).observe(document.getElementById('root'));initialize();}
if(typeof module!=='undefined'&&module.exports){module.exports={PANEL_VERSION,canExpand,expandPanel,TASKS,GROUPS,PARENTS,LEVELS,esc,effortKey,effortLabel,routeKey,recipeKey,effectiveRoute,getEffective,isExpanded,childDifference,childVisible,effortBars,escalationSummary,changeEscalation,matchedPreset,modelIdentity,knownChanges,unpack,reviewRequest,Bridge,state,acceptState,observed,assignment,matrix,matrixLegend,sidebar,diffFile,reviewDialog,editField,editInlineField,openField,closeField,queueDraftSave,moreSettings,handleAction,submitForm,applyReview,prepare,render,selectConfiguration,catalog,initialize,sourceCard,installMac,macInstallControl,brand,interfacePicker,openInterface,safeWebURL,beginEdit,cancelEdit,saveEdit,draftKey,draftShortcut,travelDraft,installationLabel,updateNotice,updateControls,checkUpdates,claudeUsage,claudeConnectionNeeded,rearmClaudeConnectionPrompt,presentPendingClaudeConnection,claudePreviewNeedsCheck,introducesClaudeForCodex,offerClaudeConnection,canConnectClaude,claudeConnectionDialog,openClaudeConnection,runClaudeConnection,cancelClaudeConnection,setBridge:value=>{bridge=value;bridge.onDispose=cancelClaudeConnection;}};}else start();
